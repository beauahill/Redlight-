<text x="1230.0" y="408.0" font-size="16" font-weight="700" fill="#1c2321" text-anchor="middle">Amp (MAX98357A)</text>
<text x="1230.0" y="427.0" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="middle">on the board</text>
