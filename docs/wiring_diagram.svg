<polyline points="250,946 300,946" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="250,946 300,946" fill="none" stroke="#1b1f23" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="470,918 560,918" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="470,918 560,918" fill="none" stroke="#d2362b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="470,946 560,946" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="470,946 560,946" fill="none" stroke="#1b1f23" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="700,770 700,648" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="700,770 700,648" fill="none" stroke="#1b1f23" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="830,770 830,732" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="830,770 830,732" fill="none" stroke="#d2362b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="870,690 870,648" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="870,690 870,648" fill="none" stroke="#d2362b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="574" y="805" font-size="13" font-weight="700" fill="#1c2321" text-anchor="start">BAT+</text>
<text x="574" y="845" font-size="13" font-weight="700" fill="#1c2321" text-anchor="start">BAT−</text>
<text x="574" y="923" font-size="13" font-weight="700" fill="#1c2321" text-anchor="start">VIN +</text>
<text x="574" y="951" font-size="13" font-weight="700" fill="#1c2321" text-anchor="start">VIN −</text>
<text x="700" y="790" font-size="13" font-weight="700" fill="#1c2321" text-anchor="middle">OUT −</text>
<text x="830" y="790" font-size="13" font-weight="700" fill="#1c2321" text-anchor="middle">OUT +</text>
<text x="30" y="118" font-size="17" font-weight="700" fill="#1c2321" text-anchor="start">Wires</text>
<line x1="30" y1="139" x2="74" y2="139" stroke="#d2362b" stroke-width="5" stroke-linecap="round"/>
<text x="88" y="144" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">5 V</text>
<line x1="30" y1="163" x2="74" y2="163" stroke="#1b1f23" stroke-width="5" stroke-linecap="round"/>
<text x="88" y="168" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">ground</text>
<line x1="30" y1="187" x2="74" y2="187" stroke="#e08a1e" stroke-width="5" stroke-linecap="round"/>
<text x="88" y="192" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">battery +</text>
<line x1="30" y1="211" x2="74" y2="211" stroke="#2f6fb5" stroke-width="5" stroke-linecap="round"/>
<text x="88" y="216" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">speaker</text>
<line x1="30" y1="235" x2="74" y2="235" stroke="#7d8791" stroke-width="5" stroke-linecap="round"/>
<text x="88" y="240" font-size="14" font-weight="400" fill="#1c2321" text-anchor="start">signals on the board (no wiring needed)</text>
<text x="30" y="286" font-size="17" font-weight="700" fill="#1c2321" text-anchor="start">Notes</text>
<text x="30" y="310" font-size="14" font-weight="700" fill="#1c2321" text-anchor="start">Power wires</text>
<text x="30" y="329" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="start">22 AWG or thicker for the red and black wires.</text>
<text x="30" y="346" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="start">The battery-gauge wire carries almost nothing.</text>
<text x="30" y="371" font-size="14" font-weight="700" fill="#1c2321" text-anchor="start">Fuse</text>
<text x="30" y="390" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="start">In the battery + lead, close to the cells.</text>
<text x="30" y="415" font-size="14" font-weight="700" fill="#1c2321" text-anchor="start">Slide switch</text>
<text x="30" y="434" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="start">Cuts 5 V to the board only. The module stays on the</text>
<text x="30" y="451" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="start">cells, so it charges with the light switched off.</text>
<text x="30" y="476" font-size="14" font-weight="700" fill="#1c2321" text-anchor="start">Module connections</text>
<text x="30" y="495" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="start">BAT+ / BAT− pads; OUT on the big USB socket&#x27;s two</text>
<text x="30" y="512" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="start">outer pins; VIN at the capacitor beside the VIN label.</text>
<text x="30" y="529" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="start">Confirm each with a meter before soldering.</text>
<text x="30" y="554" font-size="14" font-weight="700" fill="#1c2321" text-anchor="start">Speaker</text>
<text x="30" y="573" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="start">Both wires go to the amp. Neither goes to ground.</text>
<text x="30" y="598" font-size="14" font-weight="700" fill="#1c2321" text-anchor="start">Reworked v2 board</text>
<text x="30" y="617" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="start">Wires W1 and W2 already sit on J1&#x27;s GND and 5V</text>
<text x="30" y="634" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="start">pads. The amp also needs a wire from J1 5V to VIN.</text>
</svg>