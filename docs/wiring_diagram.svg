<polyline points="1120,531 640,531 640,452" fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1120,531 640,531 640,452" fill="none" stroke="#7d8791" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="880" y="547" font-size="13" font-weight="700" fill="#7d8791" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">buttons</text>
