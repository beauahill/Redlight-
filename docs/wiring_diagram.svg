<text x="1305.0" y="765.0" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="middle">4 Ω, 3 W (original)</text>
<polyline points="1340,404 1440,404 1440,750 1420,750" fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1340,404 1440,404 1440,750 1420,750" fill="none" stroke="#2f6fb5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1340,420 1428,420 1428,736 1420,736" fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="1340,420 1428,420 1428,736 1420,736" fill="none" stroke="#2f6fb5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1416" y="620" font-size="13" font-weight="700" fill="#2f6fb5" text-anchor="end" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">speaker + and −</text>
<rect x="60" y="770" width="270" height="92" rx="8" fill="#fff3d9" stroke="#1c2321" stroke-width="1.6"/>
<text x="195.0" y="803.0" font-size="16" font-weight="700" fill="#1c2321" text-anchor="middle">4 × 18650 cells</text>
<text x="195.0" y="822.0" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="middle">all in parallel</text>
<text x="195.0" y="841.0" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="middle">two 2-cell holders</text>
<rect x="380" y="782" width="90" height="36" rx="8" fill="#ffffff" stroke="#1c2321" stroke-width="1.6"/>
<text x="425.0" y="805.0" font-size="16" font-weight="700" fill="#1c2321" text-anchor="middle">3 A fuse</text>
<rect x="60" y="896" width="190" height="72" rx="8" fill="#ffffff" stroke="#1c2321" stroke-width="1.6"/>
<text x="155.0" y="928.0" font-size="16" font-weight="700" fill="#1c2321" text-anchor="middle">5 V, 2 A adapter</text>
<text x="155.0" y="947.0" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="middle">centre positive</text>
<rect x="300" y="896" width="170" height="72" rx="8" fill="#ffffff" stroke="#1c2321" stroke-width="1.6"/>
<text x="385.0" y="928.0" font-size="16" font-weight="700" fill="#1c2321" text-anchor="middle">Barrel jack</text>
<text x="385.0" y="947.0" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="middle">5.5 × 2.1 mm</text>
<rect x="560" y="770" width="300" height="198" rx="8" fill="#e3f1ea" stroke="#1c2321" stroke-width="1.6"/>
<text x="710.0" y="865.0" font-size="16" font-weight="700" fill="#1c2321" text-anchor="middle">Charge / boost module</text>
<text x="710.0" y="884.0" font-size="13" font-weight="400" fill="#5f6b66" text-anchor="middle">DFRobot DFR0446</text>
<rect x="790" y="690" width="160" height="42" rx="8" fill="#ffffff" stroke="#1c2321" stroke-width="1.6"/>
<text x="870.0" y="716.0" font-size="16" font-weight="700" fill="#1c2321" text-anchor="middle">Slide switch</text>
<polyline points="330,800 380,800" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="330,800 380,800" fill="none" stroke="#e08a1e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
