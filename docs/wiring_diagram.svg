<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1010" width="1500" height="1010" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1500" height="1010" fill="#ffffff"/>
