<polyline points="510,800 510,668 600,668 600,648" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="510,800 510,668 600,668 600,648" fill="none" stroke="#e08a1e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="510" cy="800" r="6" fill="#e08a1e" stroke="#ffffff" stroke-width="2"/>
<text x="520" y="690" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">battery gauge (thin wire)</text>
<polyline points="330,840 560,840" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="330,840 560,840" fill="none" stroke="#1b1f23" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
