<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs><marker id="h" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2185b"/></marker></defs>
<rect width="900" height="600" fill="#ffffff"/>
<text x="24" y="40" font-size="26" font-weight="700" fill="#1c2321">TEST button extender</text>
<text x="24" y="66" font-size="15" fill="#5f6b66">Side view, cut through the middle of the button. The switch is above; the button is pressed from below.</text>
<polygon points="97.3,270.0 562.7,270.0 562.7,311.6 97.3,311.6" fill="#f2b8b0" stroke="#1c2321" stroke-width="1.6" />
<polygon points="213.0,311.6 447.0,311.6 447.0,439.0 213.0,439.0" fill="#f2b8b0" stroke="#1c2321" stroke-width="1.6" />
<polygon points="289.1,270.0 370.9,270.0 370.9,439.0 289.1,439.0" fill="#ffffff" stroke="#1c2321" stroke-width="1.6" stroke-dasharray="5 4"/>
<polygon points="454.8,270.0 564.0,270.0 564.0,223.2 454.8,223.2" fill="#e58a7d" stroke="#1c2321" stroke-width="1.6" />
<polygon points="239.0,270.0 292.9,270.0 292.9,363.6 303.4,374.0 356.6,374.0 367.1,363.6 367.1,270.0 449.6,270.0 449.6,221.9 569.2,221.9 569.2,270.0 678.4,270.0 678.4,184.2 239.0,184.2" fill="#f2a23c" stroke="#1c2321" stroke-width="1.6" fill-opacity="0.92"/>
<path d="M574.4,114.2 h52 v44 h-17 v24 h-18 v-24 h-17 z" fill="#3a4046" stroke="#1c2321" stroke-width="1.4"/>
<text x="600.4" y="104.2" font-size="14" font-weight="700" fill="#1c2321" text-anchor="middle">switch plunger</text>
<line x1="509.4" y1="160.8" x2="600.4" y2="160.8" stroke="#c2185b" stroke-width="2" marker-start="url(#h)" marker-end="url(#h)"/>
<text x="554.9" y="152.8" font-size="14" font-weight="700" fill="#c2185b" text-anchor="middle">3.5</text>
<line x1="701.8" y1="223.2" x2="701.8" y2="184.2" stroke="#c2185b" stroke-width="2" marker-start="url(#h)" marker-end="url(#h)"/>
<text x="709.6" y="208.7" font-size="14" font-weight="700" fill="#c2185b" text-anchor="start">1.5</text>
<text x="509.4" y="250.6" font-size="12" font-weight="700" fill="#1c2321" text-anchor="middle">old bump</text>
<text x="202.6" y="358.4" font-size="12" font-weight="700" fill="#1c2321" text-anchor="end">peg in the</text>
<text x="202.6" y="376.6" font-size="12" font-weight="700" fill="#1c2321" text-anchor="end">centre hole</text>
<text x="150.6" y="294.8" font-size="12" font-weight="700" fill="#1c2321" text-anchor="middle">flange</text>
<text x="24" y="486" font-size="15" fill="#1c2321">The part is 16.9 mm long, 5.5 mm wide (into the page) and 3.3 mm thick, plus a 2.85 mm peg.</text>
<text x="24" y="510" font-size="15" fill="#1c2321">New contact surface is 3.3 mm above the flange: the old bump's 1.8 mm plus 1.5 mm.</text>
<text x="24" y="534" font-size="15" fill="#1c2321">The plunger lands 3.5 mm past the old bump, 1.5 mm beyond the end of the flange.</text>
<text x="24" y="558" font-size="15" fill="#1c2321">It prints upside down from this view: pad face on the bed, peg pointing up, no supports.</text>
<text x="24" y="582" font-size="15" fill="#1c2321">Glue it to the back of the flange once the fit is confirmed.</text>
</svg>