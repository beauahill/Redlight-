<polygon points="454.8,270.0 564.0,270.0 564.0,223.2 454.8,223.2" fill="#e58a7d" stroke="#1c2321" stroke-width="1.6" />
<polygon points="226.0,270.0 301.4,270.0 301.4,387.0 314.4,400.0 345.6,400.0 358.6,387.0 358.6,270.0 449.6,270.0 449.6,221.9 569.2,221.9 569.2,270.0 678.4,270.0 678.4,184.2 423.6,184.2 423.6,218.0 226.0,218.0" fill="#f2a23c" stroke="#1c2321" stroke-width="1.6" fill-opacity="0.92"/>
