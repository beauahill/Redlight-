<circle cx="252" cy="566" r="9" fill="#ffffff" stroke="#1c2321" stroke-width="1.5"/>
<path d="M308,550 L282,550 L190,520" fill="none" stroke="#c9972c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="408" cy="566" r="9" fill="#ffffff" stroke="#1c2321" stroke-width="1.5"/>
<path d="M352,550 L378,550 L470,520" fill="none" stroke="#c9972c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M190,520 L190,640 L408,640 L408,566" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
<path d="M190,520 L190,640 L408,640 L408,566" fill="none" stroke="#d2362b" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="190" cy="520" r="7" fill="#d2362b" stroke="#ffffff" stroke-width="2"/>
<circle cx="408" cy="566" r="6" fill="#d2362b" stroke="#ffffff" stroke-width="2"/>
<path d="M470,520 L470,684 L252,684 L252,566" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
<path d="M470,520 L470,684 L252,684 L252,566" fill="none" stroke="#1b1f23" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="470" cy="520" r="7" fill="#1b1f23" stroke="#ffffff" stroke-width="2"/>
<circle cx="252" cy="566" r="6" fill="#1b1f23" stroke="#ffffff" stroke-width="2"/>
<text x="176" y="520" font-size="14" font-weight="700" fill="#d2362b" text-anchor="end" dominant-baseline="central">chip pin 9 (VCC)</text>
<text x="484" y="520" font-size="14" font-weight="700" fill="#1b1f23" text-anchor="start" dominant-baseline="central">chip pin 10 (GND)</text>
<text x="282" y="566" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start" dominant-baseline="central">hole 9</text>
<text x="282" y="581" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start" dominant-baseline="central">GND</text>
<text x="378" y="566" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end" dominant-baseline="central">hole 10</text>
<text x="378" y="581" font-size="12" font-weight="700" fill="#ffffff" text-anchor="end" dominant-baseline="central">5 V</text>
<text x="640" y="128" font-size="16" font-weight="700" fill="#1c2321">Why</text>
<text x="640" y="150" font-size="14" fill="#5f6b66">On this board socket hole 9 is ground and hole 10 is 5 V.</text>
<text x="640" y="169" font-size="14" fill="#5f6b66">On the new chip pin 9 is its supply and pin 10 is its ground.</text>
<text x="640" y="204" font-size="16" font-weight="700" fill="#1c2321">1. Bend two pins</text>
<text x="640" y="226" font-size="14" fill="#5f6b66">Bend pins 9 and 10 straight out sideways so they</text>
<text x="640" y="245" font-size="14" fill="#5f6b66">cannot enter the socket. They are the two pins at</text>
<text x="640" y="264" font-size="14" fill="#5f6b66">the end away from the notch.</text>
<text x="640" y="299" font-size="16" font-weight="700" fill="#1c2321">2. Add two insulated wires</text>
<text x="640" y="321" font-size="14" fill="#5f6b66">Chip pin 9 to socket hole 10 (red, 5 V).</text>
<text x="640" y="340" font-size="14" fill="#5f6b66">Chip pin 10 to socket hole 9 (black, ground).</text>
<text x="640" y="359" font-size="14" fill="#5f6b66">Solid-core wire or a clipped lead plugs into the</text>
<text x="640" y="378" font-size="14" fill="#5f6b66">socket hole; insulate them where they cross.</text>
<text x="640" y="413" font-size="16" font-weight="700" fill="#1c2321">3. Check before power</text>
<text x="640" y="435" font-size="14" fill="#5f6b66">Ohms: chip pin 9 to the 5V pad at J1 reads about 0;</text>
<text x="640" y="454" font-size="14" fill="#5f6b66">chip pin 10 to the GND pad at J1 reads about 0.</text>
<text x="640" y="489" font-size="16" font-weight="700" fill="#1c2321">Never plug it in unmodified</text>
<text x="640" y="511" font-size="14" fill="#5f6b66">Straight in, it is powered backwards and will be</text>
<text x="640" y="530" font-size="14" fill="#5f6b66">destroyed. The old TBD62083APG is not used.</text>
</svg>