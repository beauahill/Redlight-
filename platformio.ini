; Redlight - ESP32 goal light firmware
;
; Uses the pioarduino platform (Arduino core 3.x), which is required for
; ESP32-C6 support and also works for the C3.
;
;   pio run -e esp32c3 -t upload        (ESP32-C3 SuperMini / DevKitM)
;   pio run -e esp32c6 -t upload        (ESP32-C6 DevKitC-1)
;   pio run -e xiao_c6 -t upload        (Seeed XIAO ESP32-C6)
;
; Pin assignments live in src/config.h and can be overridden here with
; -D PIN_xxx=N build flags.

[platformio]
default_envs = esp32c3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    tzapu/WiFiManager @ ^2.0.17
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:esp32c6]
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB   ; partitions.csv only uses 4MB

[env:xiao_c6]
board = seeed_xiao_esp32c6      ; variant enables the onboard antenna switch
